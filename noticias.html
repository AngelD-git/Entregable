<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias | Infonexia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Encabezado: menú, marca y navegación. -->
  <header class="header">
    <div class="contenedor">
      <div class="marca-grupo">
        <button class="menu-hamburguesa" aria-label="Abrir menú de navegación" aria-expanded="false">☰</button>
        <a href="index.html" class="marca">Infonexia</a>
      </div>
      <nav class="nav-principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="noticias.html">Noticias</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="favoritos.html">Favoritos</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Filtros y buscador: noticias.js los usa para el listado. -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-cabecera">
      <span class="sidebar-titulo">Categorías</span>
      <button class="sidebar-cerrar" id="cerrarSidebar" aria-label="Cerrar menú de categorías">✕</button>
    </div>
    <input type="search" id="buscador" placeholder="Buscar en todo el sitio">
    <ul>
      <li><button class="filtro activo" data-categoria="todas">Inicio</button></li>
      <li><button class="filtro" data-categoria="todas">Ver todas las categorías</button></li>
      <li><button class="filtro" data-categoria="Tecnología">Tecnología</button></li>
      <li><button class="filtro" data-categoria="Educación">Educación</button></li>
      <li><button class="filtro" data-categoria="Colombia">Colombia</button></li>
    </ul>
  </aside>

  <main class="contenedor">
    <div class="layout-con-sidebar">

      <section>
        <!-- Grilla y paginación se llenan con JavaScript. -->
        <div class="grilla-noticias" id="grilla-noticias"></div>

        <nav class="paginacion" id="paginacion"></nav>

        <!-- Mini CRUD: Filtro de noticias del usuario. -->
        <div class="panel-admin">
          <h2>Publicar una nueva noticia</h2>
          <form class="formulario" id="form-nueva-noticia">
            <div class="campo">
              <label for="nueva-categoria">Categoría</label>
              <input type="text" id="nueva-categoria" placeholder="Ej: Tecnología" required>
            </div>
            <div class="campo">
              <label for="nuevo-autor">Autor</label>
              <input type="text" id="nuevo-autor" placeholder="Tu nombre" required>
            </div>
            <div class="campo campo-completo">
              <label for="nuevo-titulo">Título</label>
              <input type="text" id="nuevo-titulo" placeholder="Título de la noticia" required>
            </div>
            <div class="campo campo-completo">
              <label for="nuevo-resumen">Resumen</label>
              <textarea id="nuevo-resumen" placeholder="Resumen breve de la noticia" required></textarea>
            </div>
            <div class="campo campo-completo">
              <button type="submit" class="btn">Publicar noticia</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="contenedor">
      <div class="footer-marca">
        <h4>Infonexia</h4>
        <p>Infonexia @2026</p>
      </div>
      <div class="footer-columna">
        <h4>Categorías</h4>
        <a href="noticias.html?categoria=Educación">Educación</a>
        <a href="noticias.html?categoria=Tecnología">Tecnología</a>
      </div>
      <div class="footer-columna">
        <h4>Legal</h4>
        <a href="#">Términos y condiciones</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/noticias.js"></script>
</body>
</html>
