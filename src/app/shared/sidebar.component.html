<div class="sidebar-overlay" [class.activo]="ui.sidebarAbierto()" (click)="ui.cerrarSidebar()"></div>

<aside class="sidebar" id="sidebar" [class.abierto]="ui.sidebarAbierto()">
  <div class="sidebar-cabecera">
    <span class="sidebar-titulo">Categorías</span>
    <button type="button" class="sidebar-cerrar" aria-label="Cerrar menú de categorías" (click)="ui.cerrarSidebar()">✕</button>
  </div>

  @if (enNoticias()) {
    <!-- Referencia local #caja para leer el texto escrito. -->
    <input
      #caja
      type="search"
      placeholder="Buscar título o resumen"
      aria-label="Buscar noticias"
      [value]="busqueda()"
      (input)="buscar(caja.value)"
    >
  } @else {
    <a routerLink="/noticias" (click)="ui.cerrarSidebar()">Buscar noticias</a>
  }

  <ul>
    <li>
      <button
        type="button"
        class="filtro"
        [class.activo]="categoria() === 'todas'"
        [attr.aria-pressed]="categoria() === 'todas'"
        (click)="filtrar('todas')"
      >Ver todas las categorías</button>
    </li>
    @for (c of categorias; track c) {
      <li>
        <button
          type="button"
          class="filtro"
          [class.activo]="categoria() === c"
          [attr.aria-pressed]="categoria() === c"
          (click)="filtrar(c)"
        >{{ c }}</button>
      </li>
    }
  </ul>
</aside>
