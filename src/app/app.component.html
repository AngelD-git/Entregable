<app-header />
<app-sidebar />

<main class="contenedor">
  <!-- Aviso si localStorage falla (property binding + interpolación). -->
  @if (almacen.aviso()) {
    <p id="aviso-almacenamiento" role="alert">{{ almacen.aviso() }}</p>
  }

  <!-- Las páginas solo se muestran cuando el catálogo JSON ya cargó. -->
  @if (noticias.cargando()) {
    <p role="status">Cargando noticias…</p>
  } @else if (noticias.error()) {
    <p role="status">
      No se pudo cargar el catálogo o contiene datos inválidos.
      <button type="button" class="btn" (click)="noticias.cargar()">Reintentar</button>
    </p>
  } @else {
    <router-outlet />
  }
</main>

<app-footer />
